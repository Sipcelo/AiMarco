<!-- AiMarco Logo · Fundo claro -->
<svg width="64" height="64"
     viewBox="0 0 64 64"
     fill="none"
     xmlns="http://www.w3.org/2000/svg">

  <!-- Arco -->
  <path
    d="M12 54 Q12 22 32 16 Q52 22 52 54"
    stroke="#2A1F0E"
    stroke-width="2.2"
    stroke-linecap="round"
    opacity="0.4"/>

  <!-- Obelisco outline -->
  <polygon
    points="32,5 39,54 25,54"
    stroke="#2A1F0E"
    stroke-width="2.2"
    stroke-linejoin="round"/>

  <!-- Topo piramidal ocre -->
  <polygon
    points="32,5 35.2,14 28.8,14"
    fill="#C8952A"/>

  <!-- Detalhe superior -->
  <line x1="28.8" y1="26"
         x2="35.2" y2="26"
         stroke="#2A1F0E"
         stroke-width="1.1"
         stroke-linecap="round"
         opacity="0.4"/>

  <!-- Ponto IA -->
  <circle cx="32" cy="34"
           r="2.5"
           fill="#C8952A"/>

  <!-- Detalhe inferior -->
  <line x1="27.2" y1="44"
         x2="36.8" y2="44"
         stroke="#2A1F0E"
         stroke-width="1.1"
         stroke-linecap="round"
         opacity="0.25"/>

  <!-- Base -->
  <line x1="8" y1="54"
         x2="56" y2="54"
         stroke="#2A1F0E"
         stroke-width="3"
         stroke-linecap="round"/>

</svg>
